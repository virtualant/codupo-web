<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Frame capture</title>
<style>
  :root { --bg: #FFFFFF; --zero: 0; }
  body { margin: var(--zero); background: var(--bg); display: flex; }
  iframe { border: var(--zero); display: block; }
</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById("f");
  f.style.width = (q.get("w") || "390") + "px";
  f.style.height = (q.get("h") || "12000") + "px";
  f.src = "../" + (q.get("page") || "index.html");
</script>
</body>
</html>
